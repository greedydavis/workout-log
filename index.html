<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="訓練紀錄">
<meta name="theme-color" content="#0f1215">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>訓練紀錄</title>
</head>
<body>

<!-- 登入 / 註冊 -->
<div id="authGate">
  <div class="authcard">
    <h1>訓練紀錄</h1>
    <p class="sub">登入後資料會同步到雲端，手機、電腦都看得到。</p>
    <div class="authfield"><input id="authEmail" type="email" placeholder="Email" autocomplete="username"></div>
    <div class="authfield"><input id="authPassword" type="password" placeholder="密碼（至少 6 碼）" autocomplete="current-password"></div>
    <div class="authmsg" id="authMsg"></div>
    <button class="btn primary" id="authSubmit">登入</button>
    <div class="authswitch">
      <span id="authSwitchText">還沒有帳號？</span>
      <button id="authSwitchBtn">註冊</button>
    </div>
    <div class="authnote" id="authSetupNote" hidden>
      尚未設定 Supabase 連線。請先依 README 建立專案，並把 URL 與 anon key 填入 supabaseClient.js。
    </div>
  </div>
</div>

<!-- 主要 App -->
<div id="app" hidden>

<header id="topbar">
  <div class="datenav">
    <button class="arrow" id="prevDay" aria-label="前一天">‹</button>
    <div class="label" id="dateLabel"></div>
    <button class="arrow" id="nextDay" aria-label="後一天">›</button>
    <span class="syncdot" id="syncDot" title="同步狀態"></span>
    <button class="today-btn" id="todayBtn" hidden>今天</button>
  </div>
</header>

<main>
  <!-- 記錄 -->
  <section id="view-log">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜尋或新增動作…" autocomplete="off" enterkeyhint="done">
      <div id="results"></div>
    </div>

    <div class="catchips" id="logCatChips"></div>

    <div class="card">
      <h2>今日紀錄</h2>
      <div id="todayList"></div>
    </div>

    <div class="card">
      <h2>最近做過</h2>
      <div class="grid" id="recentGrid"></div>
    </div>

    <div class="card">
      <h2>🍚 今天吃了</h2>
      <textarea id="food" placeholder="隨便打，不用格式"></textarea>
      <div class="bodygrid">
        <div class="bodyfield">
          <label for="bw">體重 kg</label>
          <input id="bw" type="number" inputmode="decimal" step="0.1" placeholder="—">
        </div>
        <div class="bodyfield">
          <label for="bf">體脂率 %</label>
          <input id="bf" type="number" inputmode="decimal" step="0.1" placeholder="—">
        </div>
        <div class="bodyfield">
          <label for="mm">骨骼肌 kg</label>
          <input id="mm" type="number" inputmode="decimal" step="0.1" placeholder="—">
        </div>
      </div>
    </div>
  </section>

  <!-- 週檢視 -->
  <section id="view-week" hidden>
    <div class="card">
      <div class="datenav" style="margin-bottom:12px">
        <button class="arrow" id="prevWeek">‹</button>
        <div class="label" id="weekLabel"></div>
        <button class="arrow" id="nextWeek">›</button>
      </div>
      <div class="weekgrid" id="weekGrid"></div>
      <div class="stats" id="weekStats"></div>
    </div>
    <div class="card">
      <h2>本週動作</h2>
      <div id="weekExercises"></div>
    </div>
  </section>

  <!-- 動作庫 / 趨勢 -->
  <section id="view-exercises" hidden>

    <div id="exListPane">
      <div class="card">
        <h2>身體數據</h2>
        <div class="metric-toggle" id="bodyMetricToggle"></div>
        <div id="bodyChart"></div>
      </div>
      <div class="card">
        <h2>動作</h2>
        <div class="catchips" id="exCatChips"></div>
        <div id="exList"></div>
      </div>
    </div>

    <div id="exDetailPane" hidden>
      <div class="backrow">
        <button class="back" id="exBack" aria-label="返回">‹</button>
        <div class="title">
          <div class="n" id="exDetailName"></div>
          <div class="c" id="exDetailCat"></div>
        </div>
        <button class="toggle" id="exPinBtn">釘選</button>
      </div>
      <div class="card">
        <div class="metric-toggle" id="exMetricToggle"></div>
        <div class="trend-head"><span class="v" id="exMetricVal"></span></div>
        <div id="exChart"></div>
      </div>
      <div class="card">
        <h2>歷史紀錄</h2>
        <div id="exHistory"></div>
      </div>
    </div>

  </section>

  <!-- 設定 -->
  <section id="view-settings" hidden>
    <div class="card">
      <h2>帳號</h2>
      <p class="note" id="accountEmail"></p>
      <button class="btn danger" id="signOutBtn" style="margin-top:10px">登出</button>
    </div>
    <div class="card">
      <h2>備份</h2>
      <button class="btn primary" id="exportBtn">匯出 JSON</button>
      <button class="btn" id="importBtn">匯入 JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <p class="note" id="backupNote"></p>
    </div>
    <div class="card">
      <h2>資料</h2>
      <p class="note" id="dataStats"></p>
      <button class="btn danger" id="wipeBtn" style="margin-top:10px">清除所有資料</button>
    </div>
  </section>
</main>

<nav id="tabbar">
  <button data-view="log" class="on"><span class="ic">📝</span>記錄</button>
  <button data-view="week"><span class="ic">📅</span>週</button>
  <button data-view="exercises"><span class="ic">📈</span>動作</button>
  <button data-view="settings"><span class="ic">⚙️</span>設定</button>
</nav>

<div id="scrim"></div>
<div id="sheet">
  <div class="sheet-head">
    <span class="n" id="sheetName"></span>
    <button class="x" id="sheetClose">關閉</button>
  </div>
  <div class="last-hint" id="lastHint"></div>
  <div class="newcat" id="newCatPicker" hidden>
    <div class="lbl">這個動作練哪個部位？</div>
    <div class="row" id="newCatRow"></div>
  </div>
  <div id="setRows"></div>
  <button class="btn" id="addSet" style="margin-top:4px">＋ 再一組</button>
  <div class="e1rm" id="e1rmHint"></div>
  <input id="noteInput" type="text" placeholder="備註（可留空）">
  <div class="sheet-actions">
    <button class="btn danger" id="deleteEntry">刪除</button>
    <button class="btn primary" id="saveEntry">儲存</button>
  </div>
</div>

</div><!-- /#app -->

<script type="module" src="app.js"></script>
</body>
</html>
